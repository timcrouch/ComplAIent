name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job builds its .env from the dev placeholders in .env.example (the setup action).
# No repository secrets are used. Third-party actions are pinned to full commit SHAs.

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm boundaries

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  # The suites need Postgres (pgvector), Redis, a seeded Keycloak (keycloak.int.test.ts, the
  # web BFF flow) and a running API (the web BFF flow). Plain service containers cannot
  # import and seed the Keycloak realm, so this job runs the compose stack.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # AI is mocked; the S3 values are the dev placeholders from .env.example (compose MinIO).
    env:
      AI_PROVIDER: mock
      AI_SECRETS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # test-only, not a secret
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: isms-evidence
      S3_ACCESS_KEY_ID: isms-minio
      S3_SECRET_ACCESS_KEY: dev-placeholder-minio-password
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The local embedding model (public weights, no user data) is downloaded once by the
      # embedder integration test and reused across runs. The key changes with the pinned
      # revision and file hashes (model-files.ts) and the transformers.js version (ADR-0011).
      - name: Embedding model cache key
        id: embeddings
        run: |
          version="$(node -p "require('./apps/worker/package.json').dependencies['@huggingface/transformers']")"
          echo "key=embeddings-transformers-$version-${{ hashFiles('packages/ai/src/model-files.ts') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: ${{ steps.embeddings.outputs.key }}
      - name: Start infrastructure (compose, wait, seed Keycloak users)
        run: pnpm infra:up
      - run: pnpm db:migrate:test
      - run: pnpm db:validate
      - name: Migrate the API database
        run: pnpm db:migrate
      - name: Start the API
        working-directory: apps/api
        run: |
          node --env-file=../../.env --import @swc-node/register/esm-register src/main.ts \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS "http://localhost:${API_PORT:-4000}/api/v1/health" && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1
      - run: pnpm test:integration
      - name: Service logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/api.log" || true
          docker compose --env-file .env -f infrastructure/docker/compose.yaml logs --tail 200

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Vitest has no --ci flag: with CI=true it neither writes missing snapshots nor updates
      # changed ones, so a contract change fails unless the snapshot is updated in the same PR.
      - name: OpenAPI snapshot
        env:
          CI: "true"
        run: pnpm --filter @isms/contracts exec vitest run test/openapi.test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AI is mocked; the S3 values are the dev placeholders from .env.example (compose MinIO).
    env:
      AI_PROVIDER: mock
      AI_SECRETS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # test-only, not a secret
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: isms-evidence
      S3_ACCESS_KEY_ID: isms-minio
      S3_SECRET_ACCESS_KEY: dev-placeholder-minio-password
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start infrastructure (compose, wait, seed Keycloak users)
        run: pnpm infra:up
      # e2e runs on isms_test (P2-R6); the setup project resets and seeds it.
      - run: pnpm db:migrate:test
      - name: Install Playwright browsers
        run: pnpm --filter @isms/e2e exec playwright install --with-deps chromium webkit
      # The worker embeds the library during the run; the same model cache as the integration
      # job, so it is not downloaded from the model hub on every run.
      - name: Embedding model cache key
        id: embeddings
        run: |
          version="$(node -p "require('./apps/worker/package.json').dependencies['@huggingface/transformers']")"
          echo "key=embeddings-transformers-$version-${{ hashFiles('packages/ai/src/model-files.ts') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: ${{ steps.embeddings.outputs.key }}
      # The Playwright webServer starts the API, the worker and a production build of the web
      # app (next build + next start; see e2e/playwright.config.ts).
      - run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env -f infrastructure/docker/compose.yaml logs --tail 200

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isms-${{ matrix.app }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.app }}
          tags: isms-${{ matrix.app }}:ci
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/isms-${{ matrix.app }}.tar
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Image runs as uid 10001
        run: |
          docker load --input "$RUNNER_TEMP/isms-${{ matrix.app }}.tar"
          test "$(docker run --rm isms-${{ matrix.app }}:ci id -u)" = "10001"
      # Runs the compiled production image (dist, isms-dist condition) for real. Postgres,
      # Redis and (for the API, whose /ready probes the evidence bucket) MinIO come from the
      # compose stack; the containers share the host network, so the localhost URLs of the CI
      # .env work unchanged. MinIO has no healthcheck: MINIO_DEFAULT_BUCKETS creates the bucket
      # during start-up, and the retry loop below waits for it. The worker's /healthz is
      # liveness only and the web image has no backing service, so they need no MinIO.
      - name: Smoke-run isms-${{ matrix.app }}
        run: |
          cp .env.example .env
          compose="docker compose --env-file .env -f infrastructure/docker/compose.yaml"
          case "${{ matrix.app }}" in
            api) $compose up -d --wait postgres redis minio; checks="/api/v1/health /api/v1/ready"; port=4000 ;;
            worker) $compose up -d --wait postgres redis; checks="/healthz"; port=9465 ;;
            web) checks="/icon.svg"; port=3000 ;;
          esac
          docker run -d --name smoke --network host --env-file .env isms-${{ matrix.app }}:ci
          for path in $checks; do
            ok=""
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port$path"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then echo "$path did not return 2xx"; docker logs smoke; exit 1; fi
            echo "$path: $(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port$path")"
          done
          docker rm -f smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/isms-${{ matrix.app }}.tar
          retention-days: 1

  # Source and dependency scans: independent of the image build.
  security-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high
      # The osv-scanner image pinned by digest (the action only pins its image by tag).
      - name: osv-scanner (pnpm-lock.yaml)
        env:
          OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$OSV_IMAGE" \
            scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  # Image scans, after the build. No --ignore-unfixed (Ruling R29): an accepted unfixed
  # HIGH or CRITICAL finding is listed in .trivyignore with a reason and an expiry date.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for image in "$RUNNER_TEMP"/images/*.tar; do docker load --input "$image"; done
      # The Trivy CLI from its official image, pinned by digest (trivy-action's installer could
      # not fetch v0.76.1).
      - name: Trivy (isms-api, isms-worker, isms-web)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          status=0
          for app in api worker web; do
            echo "::group::isms-$app"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$PWD/.trivyignore:/trivyignore:ro" \
              "$TRIVY_IMAGE" image --no-progress --ignorefile /trivyignore \
              --severity HIGH,CRITICAL --exit-code 1 "isms-$app:ci" || status=1
            echo "::endgroup::"
          done
          exit "$status"
