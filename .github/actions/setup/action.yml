name: Set up workspace
description: >-
  pnpm (from packageManager), Node (from .nvmrc) with a cached pnpm store, the CI .env built
  from the dev placeholders in .env.example, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Environment from .env.example (dev placeholders only)
      shell: bash
      run: cp .env.example .env
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
