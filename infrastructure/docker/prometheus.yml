global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # Future targets: down until the apps run on the host.
  - job_name: isms-api
    static_configs:
      - targets: ["host.docker.internal:9464"]
  # Worker metrics are on WORKER_METRICS_PORT (9466); 9465 is its /healthz endpoint only.
  - job_name: isms-worker
    static_configs:
      - targets: ["host.docker.internal:9466"]
